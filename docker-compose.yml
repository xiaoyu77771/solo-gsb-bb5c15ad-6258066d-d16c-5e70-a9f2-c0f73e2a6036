services:
  kiln-precheck:
    build: .
    image: kiln-precheck:latest
    container_name: kiln-precheck
    ports:
      - "3000:3000"
    volumes:
      # 方案 JSON 持久化到宿主机，重建容器不丢失
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
